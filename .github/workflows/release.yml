name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Releases に ZIP と照合表を載せる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" docs/downloads/*.zip docs/downloads/SHA256SUMS.txt \
            --title "SmartTools $GITHUB_REF_NAME" \
            --notes-file .github/release_notes.md \
            --verify-tag
