name: Release sync
# main の docs/downloads（ZIP と照合表）と .github/release_notes.md に、Release の中身を合わせる。
# 版は 1.0.0 のまま修正を重ねるので、ZIP が変わるたびに Release v1.0.0 も main と同じにする（タグは動かさない）。
# 正式リリースで版を上げる時は、新しいタグの push で release.yml が新しい Release を作る。その時はここの TAG も変える。
on:
  push:
    branches:
      - main
    paths:
      - "docs/downloads/**"
      - ".github/release_notes.md"
      - ".github/workflows/release-sync.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.0.0
    steps:
      - uses: actions/checkout@v5
      - name: 照合表で ZIP を確かめる
        working-directory: docs/downloads
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS.txt
          test "$(ls -1 -- *.zip | wc -l)" -eq "$(grep -c . SHA256SUMS.txt)"
      - name: 足りない物と中身の違う物を載せる
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | [.name, (.digest // "")] | @tsv' > "$RUNNER_TEMP/have.tsv"
          up=()
          for f in docs/downloads/*.zip docs/downloads/SHA256SUMS.txt; do
            n="$(basename "$f")"
            want="sha256:$(sha256sum "$f" | cut -d ' ' -f 1)"
            have="$(awk -F '\t' -v n="$n" '$1 == n { print $2 }' "$RUNNER_TEMP/have.tsv")"
            if [ "$have" != "$want" ]; then
              echo "載せる: $n"
              up+=("$f")
            fi
          done
          echo "載せる物 ${#up[@]} 件"
          if [ "${#up[@]}" -gt 0 ]; then
            # GitHub の一時的な 5xx で 1 回だけ落ちて Release が古いまま残った（2026-11-25 f37465d）ので、間をおいてやり直す。
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "${up[@]}" --clobber; then
                break
              fi
              if [ "$i" -eq 5 ]; then
                exit 1
              fi
              echo "載せられなかった（$i 回目）。30 秒後にやり直す"
              sleep 30
            done
          fi
      - name: main に無い ZIP を外す
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[].name' > "$RUNNER_TEMP/names.txt"
          while IFS= read -r n; do
            case "$n" in
              *.zip)
                if [ ! -f "docs/downloads/$n" ]; then
                  echo "外す: $n"
                  gh release delete-asset "$TAG" "$n" --yes
                fi
                ;;
            esac
          done < "$RUNNER_TEMP/names.txt"
      - name: 説明文を合わせる
        run: gh release edit "$TAG" --notes-file .github/release_notes.md
      - name: main と同じになったかを確かめる
        run: |
          set -euo pipefail
          (cd docs/downloads && for f in *.zip SHA256SUMS.txt; do printf '%s\tsha256:%s\n' "$f" "$(sha256sum "$f" | cut -d ' ' -f 1)"; done) | sort > "$RUNNER_TEMP/want.tsv"
          for i in 1 2 3 4 5 6; do
            gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | [.name, (.digest // "")] | @tsv' | sort > "$RUNNER_TEMP/after.tsv"
            if cmp -s "$RUNNER_TEMP/want.tsv" "$RUNNER_TEMP/after.tsv"; then
              break
            fi
            echo "まだ合わない（$i 回目）。10 秒後に読み直す"
            sleep 10
          done
          diff "$RUNNER_TEMP/want.tsv" "$RUNNER_TEMP/after.tsv"
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.body' > "$RUNNER_TEMP/body.txt"
          python3 - "$RUNNER_TEMP/body.txt" <<'PY'
          import pathlib, sys
          a = pathlib.Path('.github/release_notes.md').read_text('utf-8').replace('\r\n', '\n').strip()
          b = pathlib.Path(sys.argv[1]).read_text('utf-8').replace('\r\n', '\n').strip()
          sys.exit(0 if a == b else 'Release の説明文が .github/release_notes.md と違う')
          PY
          echo "Release $TAG は main と同じ：資産 $(wc -l < "$RUNNER_TEMP/after.tsv") 件と説明文"
